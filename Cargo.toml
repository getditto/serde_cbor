[package]
name = "serde_cbor"
version = "0.11.2"
authors = [
    "Pyfisch <pyfisch@posteo.org>",
    "Steven Fackler <sfackler@gmail.com>"]
repository = "https://github.com/pyfisch/cbor"
readme = "README.md"
license = "MIT/Apache-2.0"
description = "CBOR support for serde."
keywords = ["serde", "cbor", "serialization", "no_std"]
categories = ["encoding"]
edition = "2018"

[badges]
travis-ci = { repository = "pyfisch/cbor" }
maintenance = { status = "as-is" }

[dependencies]
half = "2.7.1"
serde_core = { version = "1.0.228", default-features = false }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"], default-features = false }

[features]
default = ["std"]
# Uses `alloc` library and adds support for vector functions with
# `no_std`.
alloc = ["serde_core/alloc"]
std = ["serde_core/std"]
unsealed_read_write = []
tags = []
